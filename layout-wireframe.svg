  <text x="180" y="175" class="sublabel" text-anchor="middle">計數器 · 優先級 4.5</text>
  <text x="180" y="195" class="dim" text-anchor="middle">✓ 2.12M/秒</text>
  <text x="330" y="118" class="score">4.5</text>

