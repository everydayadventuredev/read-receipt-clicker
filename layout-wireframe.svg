  <text x="100" y="63" class="sublabel">新聞跑馬燈 · 優先級 1.8</text>
  <text x="1380" y="63" class="dim" text-anchor="end">h=32</text>
  <text x="1300" y="63" class="score">1.8</text>

  <!-- ═══ MAIN LAYOUT ═══ starts at y=76, height=824 -->
  <!-- 3 columns: LEFT 25% | MIDDLE 45% | RIGHT 30% -->

