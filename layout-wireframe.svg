  <text x="100" y="25" class="sublabel">Logo + 成就Badges + ✦商店 + 重生</text>
  <text x="1380" y="25" class="dim" text-anchor="end">h=40</text>

  <!-- ═══ TICKER ═══ 32px -->
  <rect x="0" y="42" width="1440" height="32" fill="#fffbeb" stroke="#fbbf24" stroke-opacity="0.3" class="block"/>
