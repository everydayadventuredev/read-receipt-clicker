  <text x="30" y="880" class="dim" font-size="9">優先級: 計數器4.5 > 點擊4.2 > MiniGame4.0 > 建築3.9 > 罪惡3.8 > 升級3.5 > 轉世3.2 > 統計2.8 > 成就2.5 > Ticker1.8</text>
