<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    text { font-family: 'Inter', 'Helvetica', sans-serif; }
    .label { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .sublabel { font-size: 11px; fill: #64748b; }
    .dim { font-size: 10px; fill: #94a3b8; font-family: 'JetBrains Mono', monospace; }
    .score { font-size: 12px; font-weight: 800; fill: #6366f1; }
    .block { stroke-width: 1.5; rx: 8; ry: 8; }
  </style>

  <!-- Background -->
  <rect width="1440" height="900" fill="#f8fafc"/>

  <!-- ═══ HEADER ═══ 40px -->
