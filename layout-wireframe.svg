    <text x="10" y="19" class="sublabel" font-size="11">外送客服 · 政府承辦 · 情報機構 · 社群演算法</text>
  </g>
  <g transform="translate(1030, 604)">
    <rect width="398" height="28" fill="#f8fafc" stroke="#e2e8f0" rx="6" ry="6"/>
    <text x="10" y="19" class="sublabel" font-size="11">AI客服 · 外星通訊 · 時間迴圈(NEW)</text>
  </g>
  <g transform="translate(1030, 636)">
    <rect width="398" height="20" fill="#f1f5f9" stroke="#e2e8f0" rx="4" ry="4" opacity="0.5"/>
    <text x="10" y="15" class="dim">🔒 量子已讀</text>
  </g>
  <g transform="translate(1030, 660)">
    <rect width="398" height="20" fill="#f1f5f9" stroke="#e2e8f0" rx="4" ry="4" opacity="0.5"/>
    <text x="10" y="15" class="dim">🔒 虛空已讀</text>
  </g>
  <g transform="translate(1030, 684)">
    <rect width="398" height="20" fill="#f1f5f9" stroke="#e2e8f0" rx="4" ry="4" opacity="0.5"/>
