    <text x="380" y="22" class="score" text-anchor="end" fill="#10b981">9</text>
  </g>
  <g transform="translate(1030, 534)">
    <rect width="398" height="34" fill="#eef2ff" stroke="#6366f1" stroke-opacity="0.15" rx="6" ry="6"/>
    <text x="50" y="20" class="sublabel" font-size="12" font-weight="700">公司HR</text>
    <text x="380" y="22" class="score" text-anchor="end" fill="#6366f1">18</text>
  </g>
  <g transform="translate(1030, 572)">
